name: casa-em-dia

services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      CASA_DATA_DIR: /app/.data
      CASA_TRUST_PROXY: "1"
      CASA_PUBLIC_URL: "${CASA_PUBLIC_URL:-}"
      BREVO_API_KEY: "${BREVO_API_KEY:-}"
      BREVO_FROM_EMAIL: "${BREVO_FROM_EMAIL:-}"
      BREVO_FROM_NAME: "${BREVO_FROM_NAME:-Casa em Dia}"
      CASA_SMS_ENABLED: "${CASA_SMS_ENABLED:-0}"
      BREVO_SMS_SENDER: "${BREVO_SMS_SENDER:-CasaEmDia}"
    expose:
      - "3000"
    volumes:
      - casa_data:/app/.data
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/bootstrap').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      CASA_DOMAIN: ${CASA_DOMAIN:?Defina CASA_DOMAIN no arquivo .env}
      ACME_EMAIL: ${ACME_EMAIL:?Defina ACME_EMAIL no arquivo .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  casa_data:
    name: casa-em-dia-data
  caddy_data:
    name: casa-em-dia-caddy-data
  caddy_config:
    name: casa-em-dia-caddy-config
