function demoMutation(path,b){let extra={};if(path==='complete'){const t=state.tasks.find(t=>t.id===b.id);if(!t||t.assignee_id!==state.user.id||t.status!=='pending')throw new Error('Entre como o responsável para concluir.');if(t.due_date>today())throw new Error('Conclua no dia agendado ou depois.');t.points=overdue(t)?0:10;t.status='done';t.completed_at=new Date().toISOString();extra.awarded=t.points;state.swaps.filter(s=>s.status==='pending'&&[s.task_a,s.task_b].includes(t.id)).forEach(s=>s.status='cancelled');}
else if(path==='draw'){const dates=[b.date];if(b.month){for(let d=addDay(b.date,1);d.startsWith(b.date.slice(0,7));d=addDay(d,1))dates.push(d);}extra={created:[],skipped:[]};for(const d of dates){if(off(d)){extra.skipped.push({date:d,reason:off(d)});continue;}for(const t of state.templates.filter(t=>t.active)){if(state.tasks.some(x=>x.template_id===t.id&&x.due_date===d))continue;const users=state.users.filter(u=>u.active);const loads=users.map(u=>({u,n:state.tasks.filter(t=>t.assignee_id===u.id&&t.due_date.startsWith(d.slice(0,7))&&t.status!=='paused').length}));const min=Math.min(...loads.map(x=>x.n));const eligible=loads.filter(x=>x.n===min);const u=eligible[Math.floor(Math.random()*eligible.length)].u;const created={...t,id:newId(),template_id:t.id,due_date:d,assignee_id:u.id,status:'pending',points:0};state.tasks.push(created);extra.created.push(created);}}}
else if(path==='save-user'){const old=state.users.find(u=>u.id===b.id);if(old)Object.assign(old,b,{active:b.active?1:0});else{state.users.push({...b,id:newId(),role:'member',active:1,registered:0});extra.inviteToken='demonstracao';}}
else if(path==='invite'){extra.inviteToken='demonstracao';}
else if(path==='settings'){state.settings={...state.settings,...b};state.tasks.filter(t=>['pending','paused'].includes(t.status)&&t.due_date>=today()).forEach(t=>t.status=off(t.due_date)?'paused':'pending');}
else if(path==='save-template'){const old=state.templates.find(t=>t.id===b.id);if(old)Object.assign(old,b);else state.templates.push({...b,id:newId()});}
else if(path==='save-task'){if(off(b.due_date))throw new Error('Esse dia está desativado para limpeza.');const old=state.tasks.find(t=>t.id===b.id);if(old)Object.assign(old,b);else state.tasks.push({...b,id:newId(),status:'pending',points:0});}
else if(path==='swap'){const a=state.tasks.find(t=>t.id===b.taskA),c=state.tasks.find(t=>t.id===b.taskB);if(!swappable(a)||!swappable(c))throw new Error('Escolha atividades pendentes dentro do prazo.');if(a.due_date.slice(0,7)!==c.due_date.slice(0,7))throw new Error('Escolha atividades do mesmo mês.');if(state.swaps.some(s=>s.status==='pending'&&[s.task_a,s.task_b].some(id=>[a.id,c.id].includes(id))))throw new Error('Uma atividade já tem troca pendente.');state.swaps.unshift({id:newId(),task_a:a.id,task_b:c.id,requester_id:state.user.id,recipient_id:c.assignee_id,status:'pending',created_at:new Date().toISOString()});}
else if(path==='resolve-swap'){const s=state.swaps.find(s=>s.id===b.id);if(s.status!=='pending')throw new Error('Este pedido já foi resolvido.');if(b.action==='accepted'){const a=state.tasks.find(t=>t.id===s.task_a),c=state.tasks.find(t=>t.id===s.task_b);if(!swappable(a)||!swappable(c))throw new Error('Uma atividade saiu do prazo.');[a.assignee_id,c.assignee_id]=[c.assignee_id,a.assignee_id];}s.status=b.action;}
else if(path==='change-password'){throw new Error('Crie sua casa para definir uma senha real.');}
return {...state,...extra};}
async function mutate(path,b){const result=demo?demoMutation(path,b):await request(path,b);state=result;syncNotifications();render();return result;}
function taskIcon(t){return /cozinha/i.test(t.area)?['pan','']: /banheiro/i.test(t.area)?['bath','bath']: /sala/i.test(t.area)?['couch','living']:['trash','trash'];}

function calendarView(){const first=month+'-01',count=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0).getDate(),dayTasks=state.tasks.filter(t=>t.due_date===selected&&(!calendarUser||t.assignee_id===calendarUser));return `${heading('CADA COISA NO SEU DIA','A rotina, bem dividida.','Seu mês inteiro, sem perder o que importa.',admin()?'<button class="btn secondary" data-action="generate-month">'+icon('dice',14)+' Sortear mês</button><button class="btn" data-action="edit-task">'+icon('plus',14)+' Nova atividade</button>':'')}<div class="calendar-wrap"><section class="panel calendar-panel"><div class="calendar-toolbar"><div class="row" style="gap:4px"><button class="icon-btn" data-action="shift-month" data-value="-1" aria-label="Mês anterior">${icon('left',15)}</button><h2>${monthName(first)}</h2><button class="icon-btn" data-action="shift-month" data-value="1" aria-label="Próximo mês">${icon('chevron',15)}</button></div><select id="calendar-user" aria-label="Filtrar por morador"><option value="">Todos os moradores</option>${state.users.map(u=>`<option value="${u.id}" ${calendarUser===u.id?'selected':''}>${esc(u.name.split(' ')[0])}</option>`).join('')}</select></div><div class="calendar">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map(d=>`<span class="weekday">${d}</span>`).join('')}${'<div class="calendar-day blank"></div>'.repeat(weekday(first))}${Array.from({length:count},(_,i)=>{const d=month+'-'+String(i+1).padStart(2,'0'),tasks=state.tasks.filter(t=>t.due_date===d&&t.status!=='paused'&&(!calendarUser||t.assignee_id===calendarUser));return `<div class="calendar-day ${off(d)?'off':''} ${selected===d?'selected':''}" tabindex="0" role="button" aria-label="${fmt(d)}, ${off(d)||tasks.length+' atividades'}" data-action="select-day" data-date="${d}"><span class="calendar-num ${d===today()?'today':''}">${i+1}</span>${tasks.length?`<span class="cal-count">${tasks.length} tarefas</span>`:''}${tasks.slice(0,2).map(t=>`<span class="cal-task ${t.status==='done'?'done':''}">${t.status==='done'?'✓ ':''}${esc(t.title)}</span>`).join('')}${tasks.length>2?`<span class="cal-more">+${tasks.length-2} atividades</span>`:off(d)?'<span class="cal-more">Folga</span>':''}</div>`;}).join('')}</div><div class="mini-legend" style="border:0;padding-top:16px"><span><i class="legend-dot"></i> Atividades</span><span><i class="legend-dot gray"></i> Dias desativados</span></div></section><section class="calendar-side"><div class="section-header"><div><h2 class="section-title">${fmt(selected,{day:'numeric',month:'short'})}</h2><p class="section-subtitle">${fmt(selected,{weekday:'long'})}</p></div>${selected!==today()?'<button class="panel-link" data-action="today">Ir para hoje</button>':''}</div><div class="tasks">${off(selected)?`<div class="off-note">${icon('sun',25)}<p>${esc(off(selected))}</p></div>${dayTasks.filter(t=>t.status==='done').map(t=>taskCard(t)).join('')}`:dayTasks.length?dayTasks.map(t=>taskCard(t)).join(''):empty('Dia sem atividades.','Um respiro na rotina.')} </div></section></div>`;}
function drawView(){return `${heading('SEM DISCUSSÃO. COM EQUILÍBRIO.','Deixa a sorte decidir.','Uma divisão equilibrada para todo mundo participar.')}<div class="draw-layout"><section><div class="draw-card"><div class="dice-art" id="dice-art">${icon('dice',55)}</div><div class="eyebrow">A MISSÃO DO DIA VAI PARA…</div><h2>Cada um com sua parte.</h2><p>O sorteio prioriza quem tem menos atividades no mês. A sorte desempata, o cuidado se divide.</p>${admin()?`<form id="draw-form" class="draw-controls"><label>Para qual dia?<input id="draw-date" type="date" value="${selected<today()?today():selected}" min="${today()}" required></label><button class="btn light full" type="submit">${icon('dice',17)} Sortear atividades do dia</button><div class="hint" style="color:#a4ba94;margin-top:12px">Dias de folga e feriados são respeitados.</div></form>`:`<div class="draw-controls"><span class="pill green">${icon('shield',12)} O admin organiza o sorteio da casa.</span></div>`}</div>${drawResults?`<div class="draw-result"><div class="section-header"><h2 class="section-title">Tá combinado!</h2><span class="pill green">${drawResults.created.length} atividades sorteadas</span></div>${drawResults.created.length?drawResults.created.map(t=>taskCard(t,{date:true})).join(''):empty('Esse dia já está organizado.','As tarefas existentes são preservadas. Um novo sorteio só preenche atividades que faltam.')}${drawResults.skipped.map(s=>`<p class="hint">${fmt(s.date)} · ${esc(s.reason)}</p>`).join('')}</div>`:''}</section><aside class="stack"><div class="panel"><h2 class="panel-title">Um sorteio justo, de verdade.</h2>${[['users','Todo mundo participa','Apenas moradores ativos entram no sorteio.'],['list','A carga fica equilibrada','Quem tem menos tarefas no mês recebe prioridade. Empates são aleatórios.'],['sun','Descanso é descanso','A configuração de dias e feriados vale para qualquer sorteio.'],['shield','Combinado é combinado','Tarefas já agendadas permanecem com os responsáveis.']].map(([i,t,p])=>`<div class="rule-row"><span class="rule-icon">${icon(i,16)}</span><div><strong>${t}</strong><p>${p}</p></div></div>`).join('')}</div><div class="panel"><div class="row between"><div><h2 class="panel-title">Os moradores da casa</h2><p class="hint">${state.users.filter(u=>u.active).length} pessoas no mesmo time.</p></div>${avatars()}</div><button class="panel-link" data-action="navigate" data-view="people" style="margin-top:18px">Conhecer o time ${icon('arrow',12)}</button></div>${admin()?'<button class="btn secondary full" data-action="generate-month">'+icon('calendar',15)+' Já organizar o mês inteiro</button>':''}</aside></div>`;}
function swapsView(){const relevant=state.swaps.filter(s=>s.requester_id===state.user.id||s.recipient_id===state.user.id);return `${heading('A ROTINA MUDOU? CONVERSE.','Hoje por você, amanhã por mim.','Troque atividades no mesmo mês, com o aceite de quem vai ajudar.','<button class="btn" data-action="swap-modal">'+icon('plus',14)+' Pedir uma troca</button>')}<div class="reminder" style="background:#f0f5e8;border-color:#e0e9d4;color:#80926d">${icon('info',16)}<span>A troca só acontece quando a outra pessoa aceita. Até lá, cada um continua responsável pela própria tarefa.</span></div>${!relevant.length?empty('Trocar também faz parte.','Precisou ajustar os planos? Escolha uma atividade sua e proponha uma troca com outro morador.','<button class="btn secondary" data-action="swap-modal">'+icon('swap',13)+' Propor primeira troca</button>'):relevant.map(s=>{const a=state.tasks.find(t=>t.id===s.task_a),b=state.tasks.find(t=>t.id===s.task_b);if(!a||!b)return '';const incoming=s.recipient_id===state.user.id;const labels={pending:'Aguardando aceite',accepted:'Troca aceita',rejected:'Não aceita',cancelled:'Cancelada'};return `<article class="panel swap-card"><div class="row between wrap"><div class="row">${avatar(userById(incoming?s.requester_id:s.recipient_id))}<div><p class="swap-person">${incoming?esc(userById(s.requester_id).name.split(' ')[0])+' propôs uma troca':'Você propôs uma troca com '+esc(userById(s.recipient_id).name.split(' ')[0])}</p><p class="swap-date">${fmt(dateKey(new Date(s.created_at)),{day:'numeric',month:'short'})}</p></div></div><span class="pill ${s.status==='accepted'?'green':s.status==='pending'?'orange':''}">${labels[s.status]}</span></div><div class="swap-flow"><div class="swap-task"><span class="eyebrow" style="font-size:8px">${esc(userById(s.requester_id).name.split(' ')[0])} OFERECE</span><strong>${esc(a.title)}</strong><small>${fmt(a.due_date)} · até ${a.deadline}</small></div>${icon('swap',22)}<div class="swap-task"><span class="eyebrow" style="font-size:8px">EM TROCA DE</span><strong>${esc(b.title)}</strong><small>${fmt(b.due_date)} · até ${b.deadline}</small></div></div>${s.status==='pending'?`<div class="swap-actions">${incoming?`<button class="btn secondary" data-action="resolve-swap" data-id="${s.id}" data-value="rejected">Recusar</button><button class="btn" data-action="resolve-swap" data-id="${s.id}" data-value="accepted">${icon('check',13)} Aceitar troca</button>`:`<button class="btn secondary" data-action="resolve-swap" data-id="${s.id}" data-value="cancelled">Cancelar pedido</button>`}</div>`:''}</article>`;}).join('')}`;}
function peopleView(){const s=scores(today().slice(0,7));return `${heading('CADA PESSOA FAZ A DIFERENÇA.','Um lar. Nosso time.','As pessoas que fazem essa casa acontecer.',admin()?'<button class="btn" data-action="edit-user">'+icon('plus',14)+' Novo morador</button>':'')}<div class="people-grid">${state.users.map(u=>{const score=s.find(x=>x.id===u.id);return `<article class="panel person-card"><div class="row between" style="align-items:flex-start">${avatar(u)}<span class="pill ${u.active?'green':''}">${u.role==='admin'?'Admin':!u.active?'Inativo':u.registered===0?'Convite pendente':'Morador'}</span></div><h3>${esc(u.name)} ${u.id===state.user.id?'<span class="small muted">(você)</span>':''}</h3>${u.email?`<p class="contact">${icon('mail',12)} ${esc(u.email)}</p>`:''}${u.phone?`<p class="contact">${icon('phone',12)} ${esc(u.phone)}</p>`:''}<div class="person-stats"><div><strong>${score.points}</strong><small>pontos no mês</small></div><div><strong>${score.done}</strong><small>tarefas concluídas</small></div><div><strong>${state.tasks.filter(t=>t.assignee_id===u.id&&t.status==='pending'&&t.due_date.startsWith(today().slice(0,7))).length}</strong><small>pendentes no mês</small></div></div>${admin()?`<div class="card-actions"><button data-action="edit-user" data-id="${u.id}">${icon('edit',11)} Editar</button>${u.id!==state.user.id&&u.active?`<button data-action="invite-user" data-id="${u.id}">${icon('copy',11)} ${u.registered?'Novo acesso':'Copiar convite'}</button>`:''}</div>`:''}</article>`;}).join('')}</div>${admin()?'<div class="security-note">'+icon('shield',15)+'<span>Contatos ficam disponíveis para o admin. Os demais moradores veem os nomes e o progresso da casa. Convites são links privados, válidos por 7 dias, para enviar pessoalmente.</span></div>':''}`;}
function rankingView(){const ranked=scores().filter(u=>u.active||u.points);return `${heading('TODO CUIDADO CONTA.','Pequenas tarefas. Grandes pontos.','Uma motivação a mais para fazer sua parte.')}<div class="rank-banner">${icon('trophy',43)}<div><h2>Fez no prazo? Ganhou 10 pontos.</h2><p>Sem perder pontos por atrasar. O ranking renova a cada mês, e o histórico continua.</p></div></div><div class="calendar-toolbar"><div class="row"><button class="icon-btn" data-action="shift-month" data-value="-1" aria-label="Mês anterior">${icon('left',15)}</button><h2>${monthName(month+'-01')}</h2><button class="icon-btn" data-action="shift-month" data-value="1" aria-label="Próximo mês">${icon('chevron',15)}</button></div><span class="pill green">${state.tasks.filter(t=>t.due_date.startsWith(month)&&t.status==='done').length} cuidados com a casa</span></div><div class="ranking-list">${ranked.map((u,i)=>`<article class="panel ranking-big ${i===0&&u.points?'first':''}"><span class="rank-pos ${i===0&&u.points?'crown':''}">${i===0&&u.points?icon('crown',21):String(i+1).padStart(2,'0')}</span>${avatar(u)}<div class="rank-user">${esc(u.name)}${u.id===state.user.id?' <span class="muted">(você)</span>':''}<small>${u.done} atividades concluídas no mês</small></div><span class="rank-points">${u.points} <small>pontos</small></span></article>`).join('')}</div>`;}
function adminView(){if(!admin())return empty('Área da administração.','Peça ao admin para ajustar as regras da casa.');const s=state.settings;return `${heading('O COMBINADO DA CASA.','Uma rotina do nosso jeito.','Ajuste as regras. Todo mundo segue o mesmo plano.')}<div class="admin-layout"><form id="settings-form" class="panel admin-section"><h2>Configurações da casa</h2><p>As alterações valem para a casa inteira.</p>${field('Nome da casa','houseName',s.houseName,'text','required maxlength="70"')}<label style="font-size:12px">Dias de folga</label><p class="hint">Marque os dias em que ninguém precisa limpar.</p><div class="week-options">${['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'].map((d,i)=>`<label>${d}<input type="checkbox" name="day" value="${i}" ${s.disabledDays.includes(i)?'checked':''}></label>`).join('')}</div><label class="check-row"><span><strong>Respeitar feriados</strong><small>Feriados nacionais brasileiros e as datas extras abaixo. Feriados locais devem ser adicionados.</small></span><input type="checkbox" name="skipHolidays" ${s.skipHolidays?'checked':''}></label><label class="check-row"><span><strong>Gerar as tarefas diárias</strong><small>O servidor sorteia as atividades do dia a cada manhã, enquanto estiver ligado.</small></span><input type="checkbox" name="autoGenerate" ${s.autoGenerate?'checked':''}></label><label class="check-row"><span><strong>Pausar a limpeza da casa</strong><small>Pausa as tarefas de hoje e futuras. O histórico de atividades concluídas é preservado.</small></span><input type="checkbox" name="paused" ${s.paused?'checked':''}></label><div class="field" style="margin-top:20px"><label>Repetir alertas a cada<select name="reminderMinutes">${[15,30,60,120].map(n=>`<option value="${n}" ${s.reminderMinutes===n?'selected':''}>${n} minutos</option>`).join('')}</select></label><p class="hint">Os alertas do navegador dependem da permissão e da agenda aberta.</p></div><div class="form-error" role="alert"></div><button class="btn full" type="submit">${icon('check',14)} Salvar configurações</button></form><div class="stack"><section class="panel admin-section"><div class="row between"><div><h2>Atividades recorrentes</h2><p class="hint">Entram no sorteio dos dias ativos.</p></div><button class="icon-btn" data-action="edit-template" aria-label="Adicionar atividade recorrente">${icon('plus',18)}</button></div>${state.templates.map(t=>{const[i,c]=taskIcon(t);return `<div class="template-row"><span class="task-icon ${c}">${icon(i,16)}</span><div><p>${esc(t.title)} ${!t.active?'<span class="pill">Inativa</span>':''}</p><small>${esc(t.area)} · ${t.duration} min · até ${t.deadline}</small></div><button class="icon-btn" data-action="edit-template" data-id="${t.id}" aria-label="Editar ${esc(t.title)}">${icon('edit',14)}</button></div>`;}).join('')}</section><section class="panel admin-section"><div class="row between"><div><h2>Datas extras de folga</h2><p class="hint">Feriados da cidade, viagens e combinados.</p></div><button class="icon-btn" data-action="add-holiday" aria-label="Adicionar data de folga">${icon('plus',18)}</button></div>${Object.entries(s.holidays).sort().map(([d,n])=>`<div class="holiday-row">${fmt(d,{day:'2-digit',month:'short',year:'numeric'})}<span>${esc(n)}</span><button class="icon-btn" data-action="remove-holiday" data-date="${d}" aria-label="Remover ${esc(n)}">${icon('close',12)}</button></div>`).join('')||'<p class="hint" style="margin-top:17px">Nenhuma data extra por enquanto.</p>'}</section><section class="panel admin-section"><h2>Os dados são da casa.</h2><p class="hint">Exporte moradores, tarefas, pontos e regras em JSON. Senhas e convites não entram no arquivo.</p><button class="btn secondary full" data-action="export" style="margin-top:19px">${icon('download',14)} Exportar dados</button></section></div></div>`;}
function completeModal(id){const t=state.tasks.find(t=>t.id===id);modal('Mais um cuidado com a casa.','Confira antes de marcar como concluída.',`<div class="confirm-icon">${icon('circleCheck',32)}</div><div class="confirm-copy"><strong>${esc(t.title)}</strong><br>${overdue(t)?'Esta tarefa passou do prazo e não soma pontos.<br>Concluir encerra os alertas.':'No prazo, essa tarefa vale <strong>+10 pontos</strong>.<br>Ao concluir, os alertas param.'}<br><small>O registro de conclusão fica no histórico.</small></div>${actions('Sim, concluí!', 'Ainda não')}`,{onSubmit:async()=>{const r=await mutate('complete',{id});closeModal();toast(r.awarded?'Boa! +10 pontos para você. A casa agradece.':'Atividade concluída. Obrigado por cuidar da casa!');}});}
function taskModal(id){const t=state.tasks.find(t=>t.id===id)||{title:'',area:'Cozinha',duration:20,deadline:'20:00',due_date:selected<today()?today():selected,assignee_id:state.user.id};modal(id?'Ajustar atividade':'Um novo cuidado com a casa',id?'Mudanças cancelam os pedidos de troca desta atividade.':'Uma tarefa pontual para o dia escolhido.',`${field('O que precisa ser feito?','title',t.title,'text','required maxlength="100"')}<div class="form-grid">${field('Ambiente','area',t.area,'text','required maxlength="40"')}${field('Duração em minutos','duration',t.duration,'number','required min="1" max="480"')}</div><div class="form-grid">${field('Dia','due_date',t.due_date,'date',`required min="${today()}"`)}${field('Concluir até','deadline',t.deadline,'time','required')}</div><div class="field"><label>Quem vai cuidar?<select name="assignee_id">${state.users.filter(u=>u.active).map(u=>`<option value="${u.id}" ${t.assignee_id===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}</select></label></div>${actions(id?'Salvar atividade':'Adicionar atividade')}`,{onSubmit:async b=>{await mutate('save-task',{...b,...(id?{id}:{}),duration:Number(b.duration)});closeModal();toast('Atividade salva na agenda da casa.');}});}
function templateModal(id){const t=state.templates.find(t=>t.id===id)||{title:'',area:'Cozinha',duration:20,deadline:'20:00',active:1};modal(id?'Atividade recorrente':'Mais uma tarefa na rotina','Alterações valem para os próximos sorteios. Tarefas já agendadas preservam os detalhes.',`${field('Nome da atividade','title',t.title,'text','required maxlength="100"')}${field('Ambiente','area',t.area,'text','required maxlength="40"')}<div class="form-grid">${field('Duração em minutos','duration',t.duration,'number','required min="1" max="480"')}${field('Concluir até','deadline',t.deadline,'time','required')}</div><label class="check-row"><span><strong>Entrar nos próximos sorteios</strong></span><input name="active" type="checkbox" ${t.active?'checked':''}></label>${actions('Salvar atividade')}`,{onSubmit:async(b,f)=>{await mutate('save-template',{...b,...(id?{id}:{}),duration:Number(b.duration),active:f.elements.active.checked});closeModal();toast('Rotina atualizada para os próximos sorteios.');}});}
function userModal(id){const u=state.users.find(u=>u.id===id)||{name:'',email:'',phone:'',active:1};modal(id?'Os dados do morador':'Mais alguém para somar',id?'Atualize os contatos e o acesso à rotina da casa.':'Depois do cadastro, envie o link privado de convite para essa pessoa.',`${field('Nome','name',u.name,'text','required maxlength="70" autocomplete="name"')}${field('E-mail','email',u.email,'email','required maxlength="254" autocomplete="email"')}${field('Telefone','phone',u.phone,'tel','maxlength="30" autocomplete="tel" placeholder="(11) 99999-9999"')}${id&&u.id!==state.user.id?`<label class="check-row"><span><strong>Morador ativo</strong><small>Reatribua as atividades pendentes antes de desativar.</small></span><input name="active" type="checkbox" ${u.active?'checked':''}></label>`:''}${actions(id?'Salvar dados':'Cadastrar e criar convite')}`,{onSubmit:async(b,f)=>{const r=await mutate('save-user',{...b,...(id?{id}:{}),active:f.elements.active?f.elements.active.checked:true});closeModal();if(r.inviteToken)inviteModal(r.inviteToken);else toast('Dados atualizados.');}});}
function inviteModal(token){const link=location.origin+'/convite?token='+encodeURIComponent(token);modal(demo?'Um convite de demonstração':'Convite pronto para compartilhar',demo?'Os dados desta casa são fictícios. Crie sua casa para gerar convites reais.':'Envie esse link pessoalmente ao morador. Ele define a própria senha.',`<span class="invite-link">${esc(link)}</span><p class="hint">Uso único · válido por 7 dias. Um novo convite invalida o anterior.<br>O sistema não envia e-mails automaticamente.</p><div class="modal-actions"><button type="button" class="btn secondary" data-action="close-modal">Fechar</button><button type="button" class="btn" data-action="copy-invite" data-value="${esc(link)}">${icon('copy',14)} Copiar link</button></div>`);}
function swapModal(taskId){const own=state.tasks.filter(t=>t.assignee_id===state.user.id&&swappable(t));if(!own.length){modal('Sem atividades para trocar.','Trocas acontecem entre atividades pendentes dentro do prazo.',empty('Tudo resolvido por aqui.','Quando você tiver uma atividade pendente, poderá propor uma troca.')+'<div class="modal-actions"><button type="button" class="btn" data-action="close-modal">Entendi</button></div>');return;}const selectedTask=own.find(t=>t.id===taskId)||own[0];modal('Vamos ajustar os planos?','A troca só é efetivada quando o outro morador aceita.',`<div class="field"><label>Minha atividade<select id="swap-own" name="taskA">${own.map(t=>`<option value="${t.id}" ${t.id===selectedTask.id?'selected':''}>${esc(t.title)} · ${fmt(t.due_date,{day:'2-digit',month:'2-digit'})}</option>`).join('')}</select></label></div><div class="row" style="justify-content:center;margin:14px;color:#8eaa77">${icon('swap',24)}</div><div class="field"><label>Quero trocar por<select id="swap-other" name="taskB" required>${swapOptions(selectedTask)}</select></label></div><p class="hint">Apenas atividades do mesmo mês, ainda no prazo, podem ser trocadas.</p>${actions('Enviar pedido')}`,{onSubmit:async b=>{await mutate('swap',b);closeModal();toast('Pedido enviado. Agora é só aguardar o aceite.');}});}
function swapOptions(t){const other=state.tasks.filter(x=>x.assignee_id!==state.user.id&&userById(x.assignee_id).active&&swappable(x)&&x.due_date.startsWith(t.due_date.slice(0,7)));return other.length?other.map(x=>`<option value="${x.id}">${esc(x.title)} · ${fmt(x.due_date,{day:'2-digit',month:'2-digit'})} · ${esc(userById(x.assignee_id).name.split(' ')[0])}</option>`).join(''):'<option value="">Nenhuma atividade elegível neste mês</option>';}
function generateMonthModal(){const earliest=month<today().slice(0,7)?today():month===today().slice(0,7)?today():month+'-01';modal('Deixar o mês organizado.','O sorteio distribui as atividades recorrentes nos dias ativos.',`${field('Começar em','date',earliest,'date',`required min="${today()}"`)}<div class="security-note">${icon('info',15)}<span>Serão sorteadas as tarefas da data escolhida até o fim daquele mês. Dias de folga e atividades já existentes são respeitados.</span></div>${actions('Sortear até o fim do mês')}`,{onSubmit:async b=>{const r=await mutate('draw',{date:b.date,month:true});drawResults=r;month=b.date.slice(0,7);view='calendar';selected=b.date;closeModal();render();toast(`${r.created.length} atividades adicionadas. ${r.skipped.length} dias de folga respeitados.`);}});}
function notificationsModal(){const tasks=pendingMine();modal('Um lembrete de cuidado.',tasks.length?`${tasks.length} atividades suas ainda precisam de atenção.`:'Tudo em dia com as suas atividades.',`${tasks.map(t=>`<div class="notification-item">${icon('bell',16)}<div style="flex:1"><p>${esc(t.title)}</p><small>${fmt(t.due_date)} · até ${t.deadline} · ${overdue(t)?'em atraso':'pendente'}</small></div><button type="button" class="complete-btn" data-action="complete" data-id="${t.id}">${icon('check',12)} Concluir</button></div>`).join('')||empty('Você fez sua parte.','Nenhuma atividade pendente até hoje. A casa agradece!')}<div class="notifications-permission"><p>${icon('bell',13)} Alertas no navegador</p><small>A agenda repete avisos a cada ${state.settings.reminderMinutes} minutos enquanto estiver aberta, até você concluir a atividade. O navegador pode limitar notificações em segundo plano. Avisos com a agenda fechada não estão incluídos.</small><button type="button" class="btn secondary" data-action="enable-notifications">${icon('bell',13)} ${notificationEnabled()?'Alertas ativados':'Ativar alertas neste aparelho'}</button></div>`);}
function notificationEnabled(){return 'Notification'in window&&Notification.permission==='granted'&&localStorage.getItem('casa-alerts')==='yes';}
const liveNotifs=new Map();
function syncNotifications(){if(!state)return;const ids=new Set(pendingMine().map(t=>t.id));for(const[id,n]of liveNotifs)if(!ids.has(id)){n.close();liveNotifs.delete(id);}}
function notifyPending(){if(!state||!notificationEnabled())return;for(const t of pendingMine()){const key='casa-last-alert-'+state.user.id+'-'+t.id,last=Number(localStorage.getItem(key)||0);if(Date.now()-last<state.settings.reminderMinutes*60000)continue;try{liveNotifs.get(t.id)?.close();const n=new Notification('Casa em Dia · um cuidado pendente',{body:`${t.title} · ${fmt(t.due_date)} · até ${t.deadline}. Abra a agenda e marque quando concluir.`,tag:'casa-'+t.id,icon:'/favicon.svg'});n.onclick=()=>{window.focus();selected=t.due_date;view='home';render();n.close();};liveNotifs.set(t.id,n);localStorage.setItem(key,String(Date.now()));}catch{}}}
function profileModal(){modal('Seu cantinho.',`${esc(state.user.name)} · ${admin()?'admin da casa':'morador'}`,`${avatar(state.user)}<p style="margin:13px 0;font-size:12px">${esc(state.user.email||'')}</p>${demo?'<p class="hint">Experimente a rotina como outro morador:</p>'+state.users.filter(u=>u.active).map(u=>`<button type="button" class="profile-option" data-action="switch-demo" data-id="${u.id}">${avatar(u)}${esc(u.name)}${u.role==='admin'?'<span class="pill green" style="margin-left:auto">Admin</span>':''}</button>`).join(''):'<button type="button" class="btn secondary full" data-action="password-modal">'+icon('lock',14)+' Alterar minha senha</button>'}<div class="modal-actions">${demo?'<button type="button" class="btn secondary" data-action="reset-demo">Reiniciar demo</button>':'<button type="button" class="btn secondary" data-action="logout">'+icon('logout',14)+' Sair da conta</button>'}<button type="button" class="btn" data-action="close-modal">Tudo certo</button></div>`);}
function passwordModal(){modal('Uma senha só sua.','Ao salvar, as outras sessões da sua conta serão encerradas.',`${field('Senha atual','currentPassword','','password','required autocomplete="current-password"')}${field('Nova senha','password','','password','required minlength="10" maxlength="128" autocomplete="new-password"')}${field('Repita a nova senha','confirmPassword','','password','required minlength="10" maxlength="128" autocomplete="new-password"')}${actions('Salvar nova senha')}`,{onSubmit:async b=>{if(b.password!==b.confirmPassword)throw new Error('As senhas precisam ser iguais.');await mutate('change-password',b);closeModal();toast('Senha atualizada.');}});}
function createHouse(){if(setupToken){showSetup();return;}modal('Vamos preparar sua casa.','A configuração inicial usa um link privado do servidor.',`<div class="security-note">${icon('shield',20)}<span>Abra o link <strong>“Configure sua casa”</strong> mostrado no terminal ao iniciar o servidor. Por ele, você cria a conta de administrador e dá nome ao lar.<br><br>Depois, cadastre os moradores e compartilhe os convites.</span></div><p class="hint">Você está vendo uma demonstração. Nenhum dado de exemplo será copiado para a sua casa.</p><div class="modal-actions"><button class="btn" type="button" data-action="close-modal">Continuar explorando</button></div>`);}
function moreModal(){modal('Nossa casa.','Tudo o que faz parte da rotina.',`${[['people','users','Moradores'],['ranking','trophy','Ranking'],...(admin()?[['admin','settings','Administração']]:[])].map(([v,i,t])=>`<button type="button" class="profile-option" data-action="navigate" data-view="${v}">${icon(i,19)}${t}${icon('chevron',14)}</button>`).join('')}<button type="button" class="profile-option" data-action="profile">${icon('users',19)}Meu perfil</button>`);}
function holidayModal(){modal('Um dia para descansar.','Adicione feriados locais, viagens ou uma folga combinada.',`${field('Dia','date',today(),'date','required')}${field('Motivo da folga','name','','text','required maxlength="70" placeholder="Ex.: aniversário da cidade"')}${actions('Adicionar data')}`,{onSubmit:async b=>{await mutate('settings',{...state.settings,holidays:{...state.settings.holidays,[b.date]:b.name}});closeModal();toast('Data adicionada. Ative “Respeitar feriados” para aplicá-la.');}});}
function loginLayout(content){app.innerHTML=`<div class="login-screen"><section class="login-story">${brand()}<div class="story-copy"><div class="eyebrow" style="margin-bottom:15px">UM LAR, MUITAS MÃOS.</div><h1>Uma casa boa<br>de viver começa<br>com todo mundo.</h1><p>Divida as tarefas, combine os cuidados e deixe mais espaço para as coisas boas da convivência.</p></div>${houseArt()}<p class="small">${icon('heart',12)} Cuidar da casa é cuidar de quem mora nela.</p></section><section class="login-form-wrap"><div class="login-form">${content}</div></section></div>`;}
function showLogin(){clearInterval(pollTimer);clearInterval(reminderTimer);loginLayout(`<div class="eyebrow">QUE BOM TER VOCÊ AQUI.</div><h2>De volta ao nosso lar.</h2><p>Entre para ver sua parte na rotina da casa.</p><form id="login-form"><div class="form-error" role="alert"></div>${field('Seu e-mail','email','','email','required autocomplete="username"')}${field('Sua senha','password','','password','required autocomplete="current-password"')}<button type="submit" class="btn full">Entrar na casa ${icon('arrow',15)}</button></form><p class="login-footnote">Primeiro acesso ou esqueceu a senha?<br>Peça ao admin um novo link de acesso.</p>`);}
function showSetup(){closeModal();loginLayout(`<div class="eyebrow">NOSSA HISTÓRIA COMEÇA AQUI.</div><h2>Vamos dar nome ao lar?</h2><p>Crie sua conta de administrador. Depois, convide o time.</p><form id="setup-form"><div class="form-error" role="alert"></div>${field('Nome da casa','houseName','','text','required maxlength="70" placeholder="Ex.: República Boa Vista"')}${field('Seu nome','name','','text','required maxlength="70" autocomplete="name"')}${field('Seu e-mail','email','','email','required autocomplete="username"')}${field('Seu telefone (opcional)','phone','','tel','maxlength="30" autocomplete="tel"')}${field('Crie uma senha','password','','password','required minlength="10" maxlength="128" autocomplete="new-password"')}<p class="hint">Use pelo menos 10 caracteres.</p><button type="submit" class="btn full">Criar minha casa ${icon('arrow',15)}</button></form><p class="login-footnote">Seus dados ficam no banco do servidor da casa.<br>Os exemplos da demonstração não serão incluídos.</p>`);}
async function showInvite(){try{const info=await request('invite-info?token='+encodeURIComponent(inviteToken));loginLayout(`<div class="eyebrow">TEM LUGAR PARA VOCÊ.</div><h2>Bem-vindo, ${esc(info.name.split(' ')[0])}.</h2><p>Defina sua senha para entrar na rotina da casa.</p><form id="invite-form"><div class="form-error" role="alert"></div>${field('Seu e-mail','email',info.email,'email','disabled')}${field('Crie uma senha','password','','password','required minlength="10" maxlength="128" autocomplete="new-password"')}${field('Repita a senha','confirmPassword','','password','required minlength="10" maxlength="128" autocomplete="new-password"')}<button type="submit" class="btn full">Entrar para o time ${icon('arrow',15)}</button></form><p class="login-footnote">Convite pessoal, de uso único.<br>Ao entrar, você verá a agenda compartilhada da casa.</p>`);}catch(e){loginLayout(`<h2>Vamos pedir outro convite?</h2><p>${esc(e.message)}</p><a href="/" class="btn full">Voltar ao início</a>`);}}
function startTimers(){clearInterval(pollTimer);clearInterval(reminderTimer);pollTimer=setInterval(async()=>{if(demo||!state||document.hidden||modalRoot.children.length)return;try{state=await request('state');syncNotifications();render();}catch{}},20000);reminderTimer=setInterval(notifyPending,60000);}
async function boot(){try{const status=await request('bootstrap');if(inviteToken&&location.pathname==='/convite'){await showInvite();return;}if(status.user){state=await request('state');demo=false;render();startTimers();}else if(status.configured){showLogin();}else if(setupToken){showSetup();}else{demo=true;state=fakeData();render();startTimers();}}catch{loginLayout('<h2>Vamos reconectar a casa.</h2><p>Não foi possível falar com o servidor. Confira se ele está ligado e tente novamente.</p><a class="btn full" href="/">Tentar de novo</a>');}}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action,id=b.dataset.id;try{if(action==='navigate'){view=b.dataset.view;month=selected.slice(0,7);closeModal();render();window.scrollTo({top:0});}else if(action==='close-modal')closeModal();else if(action==='select-day'){selected=b.dataset.date;month=selected.slice(0,7);render();if(view==='calendar'&&innerWidth<761)document.querySelector('.calendar-side')?.scrollIntoView({behavior:'smooth'});}else if(action==='today'){selected=today();month=selected.slice(0,7);render();}else if(action==='shift-month'||action==='shift-mini'){const current=action==='shift-mini'?selected.slice(0,7):month;const d=new Date(current+'-01T12:00:00Z');d.setUTCMonth(d.getUTCMonth()+Number(b.dataset.value));month=d.toISOString().slice(0,7);if(action==='shift-mini')selected=month+'-01';render();}else if(action==='filter'){filter=b.dataset.value;render();}else if(action==='complete')completeModal(id);else if(action==='edit-task')taskModal(id);else if(action==='edit-template')templateModal(id);else if(action==='edit-user')userModal(id);else if(action==='swap-modal')swapModal(id);else if(action==='generate-month')generateMonthModal();else if(action==='notifications')notificationsModal();else if(action==='profile')profileModal();else if(action==='more')moreModal();else if(action==='add-holiday')holidayModal();else if(action==='password-modal')passwordModal();else if(action==='create-house')createHouse();else if(action==='enable-notifications'){if(!('Notification'in window)){toast('Este navegador não oferece notificações neste contexto.',true);return;}if(!window.isSecureContext){toast('Notificações exigem HTTPS ou localhost. Os alertas internos continuam ativos.',true);return;}const permission=await Notification.requestPermission();if(permission==='granted'){localStorage.setItem('casa-alerts','yes');toast('Alertas ativados neste aparelho.');notifyPending();notificationsModal();}else toast('Ative a permissão nas configurações do navegador. Os alertas internos continuam.',true);}else if(action==='switch-demo'){state.user=state.users.find(u=>u.id===id);if(!admin()&&view==='admin')view='home';closeModal();render();toast('Vendo a casa como '+state.user.name.split(' ')[0]);}else if(action==='reset-demo'){state=fakeData();view='home';selected=today();month=selected.slice(0,7);drawResults=null;closeModal();render();toast('Demonstração reiniciada.');}else if(action==='resolve-swap'){b.disabled=true;await mutate('resolve-swap',{id,action:b.dataset.value});toast(b.dataset.value==='accepted'?'Troca aceita! A agenda dos dois já foi atualizada.':'Pedido atualizado.');}else if(action==='invite-user'){b.disabled=true;const r=await mutate('invite',{id});inviteModal(r.inviteToken);}else if(action==='copy-invite'){try{await navigator.clipboard.writeText(b.dataset.value);toast('Link copiado. Envie pessoalmente ao morador.');}catch{toast('Selecione e copie o link exibido acima.',true);}}else if(action==='remove-holiday'){const holidays={...state.settings.holidays};delete holidays[b.dataset.date];await mutate('settings',{...state.settings,holidays});toast('Data de folga removida.');}else if(action==='export'){const data=demo?state:await request('export');const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='casa-em-dia-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Dados exportados. Guarde o arquivo com cuidado.');}else if(action==='logout'){await request('logout',{});state=null;for(const n of liveNotifs.values())n.close();liveNotifs.clear();closeModal();showLogin();}}catch(err){toast(err.message,true);b.disabled=false;}});
document.addEventListener('change',e=>{if(e.target.id==='calendar-user'){calendarUser=e.target.value;render();}else if(e.target.id==='swap-own'){const task=state.tasks.find(t=>t.id===e.target.value);$('#swap-other').innerHTML=swapOptions(task);}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,b=Object.fromEntries(new FormData(f)),button=$('button[type=submit]',f);if(button)button.disabled=true;try{if(f.id==='modal-form'&&modalAction){const fn=modalAction;await fn(b,f);}else if(f.id==='draw-form'){const date=$('#draw-date').value;if(date<today())throw new Error('Escolha hoje ou uma data futura.');if(off(date))throw new Error(off(date)+': escolha um dia ativo.');$('#dice-art').classList.add('rolling');const result=await (demo?Promise.resolve(demoMutation('draw',{date})):request('draw',{date}));await new Promise(resolve=>setTimeout(resolve,950));state=result;drawResults=result;render();toast(result.created.length?result.created.length+' atividades sorteadas. Tá combinado!':'Esse dia já está organizado.');}else if(f.id==='settings-form'){const s={...state.settings,...b,disabledDays:[...new FormData(f).getAll('day')].map(Number),skipHolidays:f.elements.skipHolidays.checked,paused:f.elements.paused.checked,autoGenerate:f.elements.autoGenerate.checked,reminderMinutes:Number(b.reminderMinutes)};delete s.day;await mutate('settings',s);toast('Combinados da casa atualizados.');}else if(['login-form','setup-form','invite-form'].includes(f.id)){if(f.id==='invite-form'&&b.password!==b.confirmPassword)throw new Error('As senhas precisam ser iguais.');state=await request(f.id==='login-form'?'login':f.id==='setup-form'?'setup':'accept-invite',{...b,...(f.id==='invite-form'?{token:inviteToken}:{})});demo=false;history.replaceState(null,'','/');view='home';selected=today();month=selected.slice(0,7);render();startTimers();toast(f.id==='login-form'?'Que bom ter você de volta.':'Bem-vindo! A casa agora é nossa.');}}catch(err){formError(err.message,f);$('#dice-art')?.classList.remove('rolling');}finally{if(button)button.disabled=false;}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalRoot.children.length){closeModal();return;}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.calendar-day[role=button]')){e.preventDefault();e.target.click();}if(e.key==='Tab'&&modalRoot.children.length){const focusable=[...modalRoot.querySelectorAll('button:not([disabled]),input:not([disabled]),select:not([disabled]),a[href]')];const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});
modalRoot.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop'))closeModal();});
document.addEventListener('visibilitychange',async()=>{if(!document.hidden&&state&&!demo&&!modalRoot.children.length){try{state=await request('state');syncNotifications();render();}catch{}}});
demo=true;state=fakeData();render();startTimers();</script>

  <div id="app"><div class="loading"><span class="brand-mark">⌂</span><p>Arrumando a casa por aqui…</p></div></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
