name: Publicar na Cloudflare

# O merge de um PR na main dispara a publicação, após os testes.
# Importação de dados continua sendo uma operação manual separada.
on:
  push:
    branches:
      - main
    paths:
      - 'casa-em-dia/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cloudflare-production
      url: https://casa-em-dia.casa-em-dia.workers.dev
    defaults:
      run:
        working-directory: casa-em-dia
        shell: bash
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      CI: 'true'
    steps:
      - name: Obter código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: casa-em-dia/package-lock.json
      - name: Instalar dependências fixadas
        run: npm ci
      - name: Verificar regras e backend
        run: npm test
      - name: Compilar site e validar pacote Cloudflare
        run: npm run build:cloudflare
      - name: Verificar API e banco no runtime Cloudflare local
        run: npm run test:cloudflare
      - name: Conferir se o commit ainda é o atual da main
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest_sha="$(curl --fail --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -er '.object.sha')"
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo '::notice::A main já recebeu outro commit. Esta execução não substituirá a versão mais recente.'
          fi
      - name: Validar credenciais de publicação
        if: steps.revision.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.API_CASA_EM_DIA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Configure CLOUDFLARE_API_TOKEN ou API_CASA_EM_DIA no environment cloudflare-production.'; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Configure a variable CLOUDFLARE_ACCOUNT_ID no environment cloudflare-production.'; exit 1; }
      - name: Publicar código e assets
        if: steps.revision.outputs.publish == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN || secrets.API_CASA_EM_DIA }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy:cloudflare
      - name: Conferir acesso ao site publicado
        if: steps.revision.outputs.publish == 'true'
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const response = await fetch('https://casa-em-dia.casa-em-dia.workers.dev/api/bootstrap', { signal: AbortSignal.timeout(30000) });
          assert.equal(response.status, 200);
          const state = await response.json();
          assert.equal(state.configured, true);
          assert.equal(state.user, null);
          console.log('Site publicado e banco da casa acessível.');
          NODE
